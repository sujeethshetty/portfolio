<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sujeeth Shetty · Data platforms and AI agents</title>
    <meta name="description" content="Sujeeth Shetty builds data platforms and AI agents: real-time pipelines, ML systems, and agents that get real work done." />
    <meta name="author" content="Sujeeth Shetty" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts are self-hosted (see src/main.tsx). Preload the latin Geist file the hero paints
         first so the headline doesn't flash a fallback face. Vite rewrites it to a hashed asset. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2">
    <style>
      /* Prevent FOUC by setting fallback fonts */
      body { font-family: "Geist Variable", system-ui, -apple-system, sans-serif; }
    </style>
    
    <!-- Mobile optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">

    <meta property="og:title" content="Sujeeth Shetty · Data platforms and AI agents" />
    <meta property="og:description" content="Sujeeth Shetty builds data platforms and AI agents: real-time pipelines, ML systems, and agents that get real work done." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://sujeeth.io/thumbnail_x.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="646" />
    <meta property="og:url" content="https://sujeeth.io" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@xsujeeth" />
    <meta name="twitter:image" content="https://sujeeth.io/thumbnail_x.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function() {
        var p = new URLSearchParams(location.search);
        var t = p.get('theme');
        if (t === 'dark' || t === 'light') {
          localStorage.setItem('theme', t);
          p.delete('theme');
          history.replaceState(null, '', location.pathname + (p.size ? '?' + p : ''));
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
