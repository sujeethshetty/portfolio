name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # PR branch names are author-controlled, so reduce them to a safe charset
      # before they reach the deploy command.
      - name: Resolve deploy branch
        id: branch
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      # cloudflare/pages-action was removed from GitHub; wrangler-action is its replacement.
      # Run from the repo root so ./functions (the chat API) is bundled with dist.
      # --branch keeps the old behaviour: main = production, PR branches = previews.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: pages deploy dist --project-name=sujeeth-portfolio --branch=${{ steps.branch.outputs.name }}

      - name: Add deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          echo "🌐 Global CDN enabled with edge caching" >> $GITHUB_STEP_SUMMARY